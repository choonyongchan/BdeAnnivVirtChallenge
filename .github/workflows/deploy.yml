# Publishes frontend/public/ (the static site) to GitHub Pages whenever a push to main changes it.
name: Deploy Pages

# Catches Task Scheduler (scripts/run_pipeline.ps1) commits pushed with the user's own credentials.
on:
  push:
    branches: [main]
    paths:
      - frontend/public/**

# Publish the regenerated static site to GitHub Pages.
# Requires Settings -> Pages -> Source = "GitHub Actions".
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/public

      - id: deployment
        uses: actions/deploy-pages@v5
