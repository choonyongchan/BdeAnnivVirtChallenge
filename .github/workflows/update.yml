name: Update and Deploy Strava Dashboard

on:
  schedule:
    # Hourly. GitHub's cron floor is */5, but hourly is what this challenge wants;
    # scheduled runs can still be delayed 5-20 min under load.
    - cron: '0 * * * *'
  workflow_dispatch:

# One run at a time; let an in-flight run finish (it pushes commits mid-job).
concurrency:
  group: strava-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Restore Strava session (src/auth_state.json)
        env:
          AUTH_STATE: ${{ secrets.AUTH_STATE }}
        run: |
          if [ -z "$AUTH_STATE" ]; then
            echo "::error::Secret AUTH_STATE is empty. Run 'python -m src.login' and set it." >&2
            exit 1
          fi
          base64 -d <<< "$AUTH_STATE" > src/auth_state.json

      - name: Restore nominal roll (src/nominal_roll/nominal_roll.csv)
        env:
          NOMINAL_ROLL: ${{ secrets.NOMINAL_ROLL }}
        run: base64 -d <<< "$NOMINAL_ROLL" > src/nominal_roll/nominal_roll.csv

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        id: pipeline
        run: python -m src.main

      - name: Commit ledgers (main.py only pushes index.html)
        run: |
          git add src/activities/activities.csv src/members/members.csv index.html
          if git diff --cached --quiet; then
            echo "No ledger changes."
          else
            git pull --rebase --autostash origin main
            git commit -m "🗃️ Ledger update: ${{ steps.pipeline.outputs.new_activities }} new activities, ${{ steps.pipeline.outputs.new_members }} new members"
            git push
          fi

  # Publish the regenerated root index.html to GitHub Pages.
  # Requires Settings -> Pages -> Source = "GitHub Actions".
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage site (index.html plus the badge data file)
        run: |
          mkdir _site
          cp index.html _site/
          cp user-count.json _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
