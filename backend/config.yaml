# Dashboard + scraper settings. No secrets here.
# backend/config.py reads this once; every key below is required.

club:
  name: "8SAB 50th Anniversary Virtual Challenge"
  id: "2211123"                  # Strava club id; the scrapers report on this club

challenge_start: "2026-09-14"     # local date; activities before this don't count

timezone: "Asia/Singapore"        # dashboard display tz (NOT the scraper's browser tz)

schedule:                         # local hours the hourly Task Scheduler run (at :47) does each job; "*" = every hour
  recent_activities: "*"          # club feed -> activities.csv (light, best effort)
  member_scan: [23]               # every profile + leaderboard -> activities.csv gaps + daily.csv (heavy, accurate)

weather:
  latitude: 1.3835
  longitude: 103.7478

announcement_path: "frontend/announcement.md"   # relative to repo root; missing file hides the banner

browser:
  channel: ""                   # "" -> Playwright's bundled Chromium; "chrome"/"msedge" drive a system browser
  headless: true                 # set false to watch a scrape run
